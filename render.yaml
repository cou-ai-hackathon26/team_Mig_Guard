# Render Blueprint Specification
# See https://render.com/docs/blueprint-spec for details
services:
  - type: web
    name: mig-guard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "cd backend 2>/dev/null || true; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PRIMARY_LLM_MODEL
        value: gemini-2.5-flash
